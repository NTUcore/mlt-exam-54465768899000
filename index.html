class EngineResilienceGuard extends Component {
    constructor(props) {
        super(props);
        this.state = { hasError: false };
    }
    static getDerivedStateFromError() {
        return { hasError: true };
    }
    componentDidCatch(error, errorInfo) {
        console.warn("Resilience System Auto-Recovered:", error, errorInfo);
    }
    render() {
        if (this.state.hasError) {
            return (
                <div className="p-8 text-center bg-red-950/40 border border-red-800 rounded-3xl m-6">
                    <h3 className="text-xl font-bold text-red-400 mb-2">تم رصد استثناء برمجتي - تم استعادة الثبات بنجاح 💪</h3>
                    <button onClick={() => { this.setState({ hasError: false }); window.location.reload(); }} className="px-6 py-2 bg-red-800 text-white rounded-xl font-bold">إعادة التنشيط</button>
                </div>
            );
        }
        return this.props.children;
    }
}

};

let audioCtx = null;
const getAudioContext = () => {
    if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    }
    return audioCtx;
};
const playSound = (freq, duration, type = 'sine', volume = 0.1) => {
    try {
        const ctx = getAudioContext();
        const oscillator = ctx.createOscillator();
        const gainNode = ctx.createGain();
        oscillator.type = type;
        oscillator.frequency.setValueAtTime(freq, ctx.currentTime);
        gainNode.gain.setValueAtTime(volume, ctx.currentTime);
        gainNode.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + duration);
        oscillator.connect(gainNode);
        gainNode.connect(ctx.destination);
        oscillator.start();
        oscillator.stop(ctx.currentTime + duration);
    } catch (err) {}
};

.filter(l => l !== "");

author: user.name,

const TakeExam = ({ T, user, exam, exit }) => {
const [examData, setExamData] = useState(exam);
const [idx, setIdx] = useState(0);
const [score, setScore] = useState(0);
const [done, setDone] = useState(false);
const [ans, setAns] = useState(null);
const [timer, setTimer] = useState(60);
const [start] = useState(Date.now());

const cleanQuestions = useMemo(() => {
return examData.questions.filter(q => q.text && q.text.trim() !== "" && q.options.length > 0);
}, [examData.questions]);

const current = useMemo(() => {
const q = cleanQuestions[idx];
if(!q) return null;
return { ...q, options: q.options.filter(o => o.trim() !== "") };
}, [cleanQuestions, idx]);

useEffect(() => {
if(!current) return;
setTimer(60);
const t = setInterval(() => {
setTimer(p => { if (p <= 1) { clearInterval(t); if (ans === null) { playWrongSound(); setAns(-1); } return 0; } return p - 1; });
}, 1000);
if (ans !== null) clearInterval(t);
return () => clearInterval(t);
}, [idx, ans, current]);

const removeQuestion = async (qIdx) => {
    playUIClick();
    if (!window.confirm(T.delConfirm)) return;
    const newQuestions = examData.questions.filter((_, i) => i !== qIdx);
    const examRef = window.FB.doc(window.FB.db, "exams", examData.id);
    await window.FB.updateDoc(examRef, { questions: newQuestions });
    setExamData(prev => ({...prev, questions: newQuestions}));
    if (idx >= newQuestions.length) setIdx(Math.max(0, newQuestions.length - 1));
};

const handleAnswer = (i) => {
    if(ans !== null) return;
    setAns(i);
    if(i === current.correct) {
        playCorrectSound();
        setScore(s => s + 1);
    } else {
        playWrongSound();
    }
};

const next = async () => {
playUIClick();
if (idx + 1 < cleanQuestions.length) { setIdx(idx + 1); setAns(null); }
else {
const totalTimes = (Date.now() - start) / 1000;
await window.FB.addDoc(window.FB.collection(window.FB.db, "classroom"), { subject: examData.subject, student: user.name, score, total: cleanQuestions.length, totalTimes, timestamp: window.FB.serverTimestamp() });
setDone(true);
}
};

const isAdminOrOwner = user.role === 'admin' || examData.author === user.name;
if (done) return <div className="card-glow p-12 text-center rounded-[3rem] animate-fade"><h2 className="text-yellow-500 text-3xl font-bold mb-8">{T.examDone}</h2><div className="text-6xl font-black mb-10">{score} / {cleanQuestions.length}</div><button onClick={() => { playUIClick(); exit(); }} className="bg-blue-800 text-white px-12 py-4 rounded-2xl font-bold">{T.back}</button></div>;
if (!current) return <div className="p-10 text-center">{T.noExams}</div>;
return (
<div className="w-full max-w-3xl mx-auto py-6 animate-fade">
<div className="flex justify-between text-blue-400 font-bold mb-4"><span>{examData.subject}</span><span>{idx + 1} / {cleanQuestions.length}</span></div>
<div className="w-full bg-slate-800 h-1.5 mb-6 rounded-full overflow-hidden">
<div className="timer-bar" style={{ width: `${(timer / 60) * 100}%`, background: timer < 10 ? '#ef4444' : '#10b981' }}></div>
</div>
<div className="card-glow rounded-[3rem] p-10 space-y-10 flex flex-col items-center relative">
{isAdminOrOwner && (
    <button onClick={() => removeQuestion(idx)} className="absolute top-6 left-6 text-red-500 hover:text-red-400 font-bold text-sm bg-red-900/20 px-3 py-1 rounded-lg">
        {T.deleteBtn} 🗑️
    </button>
)}
<h3 className="text-3xl font-bold text-center mt-4">{current.text}</h3>
<div className="grid gap-4 w-full">
{current.options.map((opt, i) => (
<button key={i} onClick={() => handleAnswer(i)} className={`w-full p-5 rounded-full text-center font-bold border-2 transition-none ${ans === null ?
'hover:bg-white/5 border-slate-700' : (i === current.correct ? 'bg-emerald-500/20 border-emerald-500 text-emerald-400' : (ans === i ? 'bg-red-500/20 border-red-500 text-red-400' : 'opacity-40 border-slate-800'))}`}>
{opt}
</button>
))}
</div>
{ans !== null && <button onClick={next} className="w-full bg-blue-700 text-white py-4 rounded-full font-bold text-xl transition-none">{idx + 1 === cleanQuestions.length ?
T.finishExam : T.nextQ}</button>}
</div>
</div>
);
};

const BubbleExam = ({ T, user, exam, exit }) => {
const [examData, setExamData] = useState(exam);
const [selectedStage, setSelectedStage] = useState('3rd Stage');

const cleanQuestions = useMemo(() => {
return examData.questions.filter(q => q.text && q.text.trim() !== "" && q.options.length > 0).map(q => ({
...q,
options: q.options.filter(o => o.trim() !== "")
}));
}, [examData.questions]);

const [answers, setAnswers] = useState(new Array(cleanQuestions.length).fill(null));
const [done, setDone] = useState(false);
const [score, setScore] = useState(0);
const [start] = useState(Date.now());
const [loading, setLoading] = useState(false);

const isAdminOrOwner = user.role === 'admin' || examData.author === user.name;
const removeQuestion = async (qIdx) => {
    playUIClick();
    if (!window.confirm(T.delConfirm)) return;
    const newQuestions = examData.questions.filter((_, i) => i !== qIdx);
    const examRef = window.FB.doc(window.FB.db, "exams", examData.id);
    await window.FB.updateDoc(examRef, { questions: newQuestions });
    setExamData(prev => ({...prev, questions: newQuestions}));
};

const submit = async () => {
playUIClick();
setLoading(true);
let finalScore = 0;
answers.forEach((ans, i) => { if (ans === cleanQuestions[i].correct) finalScore++; });
const totalTimes = (Date.now() - start) / 1000;
await window.FB.addDoc(window.FB.collection(window.FB.db, "classroom"), { 
    subject: examData.subject, 
    student: user.name, 
    score: finalScore, 
    total: cleanQuestions.length, 
    stage: selectedStage,
    totalTimes, 
    timestamp: window.FB.serverTimestamp() 
});
setScore(finalScore); setDone(true); setLoading(false);
};

if (done) return <div className="card-glow p-12 text-center rounded-[3rem] animate-fade"><h2 className="text-yellow-500 text-3xl font-bold mb-8">{T.examDone}</h2><div className="text-6xl font-black mb-10">{score} / {cleanQuestions.length}</div><button onClick={() => { playUIClick(); exit(); }} className="bg-blue-800 text-white px-12 py-4 rounded-2xl font-bold">{T.back}</button></div>;
return (
<div className="animate-fade w-full max-w-4xl mx-auto py-6 space-y-8">

{isAdminOrOwner && (
    <button onClick={() => removeQuestion(idx)} className="absolute top-0 left-0 text-red-500 hover:text-red-400 text-xs bg-red-950/20 px-2 py-1 rounded">

{q.text}
</h4>
<div className="grid grid-cols-1 md:grid-cols-2 gap-4 pr-10">
{q.options.map((opt, oIdx) => (

</div>
<div className="mt-12 pt-8 border-t-2 border-slate-400">
<button onClick={submit} disabled={loading || answers.includes(null)} className={`w-full py-5 rounded-2xl font-bold text-xl shadow-lg transition-none ${answers.includes(null) ?
'bg-slate-200 text-slate-400 cursor-not-allowed' : 'bg-black text-white'}`}>
{loading ? '...' : T.submitBubble}
</button>
<button onClick={() => { playUIClick(); exit(); }} className="w-full mt-4 text-slate-500 font-bold hover:text-slate-800 transition-none">{T.back}</button>
</div>
</div>
</div>
);
};

const Leaderboard = ({ T, setView, user }) => {
const [data, setData] = useState([]);
const [exams, setExams] = useState([]);
const [activeSubject, setActiveSubject] = useState('');

useEffect(() => {
if (!window.FB) return;
const qExams = window.FB.query(window.FB.collection(window.FB.db, "exams"), window.FB.orderBy("timestamp", "desc"));
const unsubExams = window.FB.onSnapshot(qExams, (snap) => {
const cur = snap.docs.map(d => ({ id: d.id, ...d.data() }));
setExams(cur); if (cur.length > 0 && !activeSubject) setActiveSubject(cur[0].subject);
}, () => {});
const qScores = window.FB.query(window.FB.collection(window.FB.db, "classroom"), window.FB.orderBy("score", "desc"));
const unsubScores = window.FB.onSnapshot(qScores, (snap) => {
const raw = snap.docs.map(d => ({ id: d.id, ...d.data() }));
const filteredMap = new Map();
const attempts = new Map();
raw.forEach(item => {
const key = `${item.student}_${item.subject}`;
attempts.set(key, (attempts.get(key) || 0) + 1);
if (!filteredMap.has(key) || filteredMap.get(key).score < item.score) filteredMap.set(key, item);
});
setData(Array.from(filteredMap.values()).map(i => ({ ...i, realAttempts: attempts.get(`${i.student}_${i.subject}`) })));
}, () => {});
return () => { unsubExams(); unsubScores(); };
}, []);

const filtered = data.filter(d => d.subject === activeSubject).sort((a, b) => b.score - a.score || a.totalTimes - b.totalTimes);

return (
<div className="card-glow rounded-3xl p-8 w-full overflow-hidden">
<div className="flex justify-between items-center border-b border-slate-800 pb-4 mb-6">
<h2 className="text-xl font-bold">{T.menuLeader}</h2>
<button onClick={() => { playUIClick(); setView('dashboard'); }} className="font-bold text-slate-400">{T.back}</button>
</div>
<div className="flex gap-2 overflow-x-auto pb-4 mb-6">
{exams.map(e => <button key={e.id} onClick={() => { playUIClick(); setActiveSubject(e.subject); }} className={`px-4 py-2 rounded-xl text-sm font-bold border transition-none ${activeSubject === e.subject ? 'bg-emerald-800 border-emerald-500 text-white' : 'bg-slate-900 border-slate-700 text-slate-500'}`}>{e.subject}</button>)}
</div>
<div className="overflow-x-auto">
<table className="w-full text-right border-separate border-spacing-y-3">
<thead><tr className="text-xs font-bold text-slate-500"><th className="px-4 py-2">#</th><th className="px-4 py-2">{T.nameCol}</th><th className="px-4 py-2">{T.score}</th><th className="px-4 py-2">{T.attempts}</th><th className="px-4 py-2">{T.secondsCol}</th></tr></thead>
<tbody>
{filtered.map((item, i) => (
<tr key={item.id} className={`${i <= 2 ? 'rank-gold' : 'rank-silver'} rounded-2xl`}>
<td className="px-4 py-4 first:rounded-r-2xl"><span className="inline-flex items-center justify-center w-8 h-8 rounded-lg rank-number font-black">{i + 1}</span></td>
<td className="px-4 py-4 font-bold">{item.student}</td>
<td className="px-4 py-4 font-black text-lg">{item.score}/{item.total}</td>
<td className="px-4 py-4 font-bold">{item.realAttempts}</td>
<td className="px-4 py-4 last:rounded-l-2xl font-mono">{Math.round(item.totalTimes)}</td>
</tr>
))}
</tbody>
</table>
</div>
</div>
);
};

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<App />);
</script>
</body>
</html>
